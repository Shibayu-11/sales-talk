appId: com.salestalk.app
productName: SalesTalk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
extraResources:
  - from: src/native/audio-capture/build/Release
    to: native/audio-capture
    filter:
      - audio_capture.node
  - from: src/native/audio-capture/.build/release
    to: native/audio-capture
    filter:
      - speech-analyzer-helper

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # URL scheme registration for macOS Shortcuts / Spotlight.
  # Enables: open salestalk://record/start?product=real_estate
  protocols:
    - name: SalesTalk
      schemes:
        - salestalk
  extendInfo:
    NSScreenCaptureUsageDescription: "Zoom 商談の音声をリアルタイムで文字起こしするため、画面収録権限が必要です。"
    NSMicrophoneUsageDescription: "あなたの発話をリアルタイムで文字起こしするため、マイクアクセスが必要です。"
    CFBundleURLTypes:
      - CFBundleURLName: com.salestalk.app
        CFBundleURLSchemes:
          - salestalk

dmg:
  sign: false

publish:
  - provider: github
    releaseType: release
